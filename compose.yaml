services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: university
      MYSQL_USER: university
      MYSQL_PASSWORD: university
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "university", "-puniversity"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/university?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: university
      SPRING_DATASOURCE_PASSWORD: university
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD: admin123

volumes:
  mysql_data:
